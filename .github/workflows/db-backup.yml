name: Supabase Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Supabase CLI
        run: |
          npm install -g supabase

      - name: Create database backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup/database

          supabase db dump \
            --db-url "$DB_URL" \
            -f backup/database/schema.sql

          supabase db dump \
            --db-url "$DB_URL" \
            -f backup/database/data.sql \
            --use-copy \
            --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"

      - name: Install storage backup dependencies
        run: |
          mkdir -p backup/storage
          npm init -y
          npm install @supabase/supabase-js

      - name: Create storage backup script
        run: |
          cat > backup-storage.mjs <<'EOF'
          import { createClient } from '@supabase/supabase-js'
          import fs from 'fs/promises'
          import path from 'path'

          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          )

          const buckets = ['gallery', 'documents']

          async function listFiles(bucket, folder = '') {
            const { data, error } = await supabase.storage
              .from(bucket)
              .list(folder, { limit: 1000 })

            if (error) {
              throw new Error(
                `Cannot list ${bucket}/${folder}: ${error.message}`
              )
            }

            const files = []

            for (const item of data ?? []) {
              const fullPath = folder
                ? `${folder}/${item.name}`
                : item.name

              if (item.id === null) {
                const nested = await listFiles(bucket, fullPath)
                files.push(...nested)
              } else {
                files.push(fullPath)
              }
            }

            return files
          }

          async function backupBucket(bucket) {
            console.log(`Backing up bucket: ${bucket}`)

            const files = await listFiles(bucket)

            for (const filePath of files) {
              console.log(`Downloading: ${bucket}/${filePath}`)

              const { data, error } = await supabase.storage
                .from(bucket)
                .download(filePath)

              if (error) {
                throw new Error(
                  `Cannot download ${bucket}/${filePath}: ${error.message}`
                )
              }

              const destination = path.join(
                'backup',
                'storage',
                bucket,
                filePath
              )

              await fs.mkdir(path.dirname(destination), {
                recursive: true
              })

              const buffer = Buffer.from(await data.arrayBuffer())

              await fs.writeFile(destination, buffer)
            }

            console.log(
              `Finished ${bucket}: ${files.length} file(s)`
            )
          }

          for (const bucket of buckets) {
            await backupBucket(bucket)
          }

          console.log('Storage backup completed.')
          EOF

      - name: Download Storage files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node backup-storage.mjs

      - name: Create backup archive
        run: |
          tar -czf supabase-backup.tar.gz backup/

      - name: Encrypt backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric \
            --cipher-algo AES256 \
            supabase-backup.tar.gz

          rm -rf backup
          rm supabase-backup.tar.gz
          rm backup-storage.mjs

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: supabase-backup.tar.gz.gpg
          retention-days: 90
